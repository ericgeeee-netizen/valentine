<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    :root { --yesScale: 1; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe1ec, #fff);
      color: #1a1a1a;
    }

    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 18px 18px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .topGif {
      width: 160px;
      height: 160px;
      object-fit: contain;
      display: block;
      margin: 4px auto 6px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.10));
    }

    h1 {
      margin: 6px 0 6px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 14px;
      opacity: 0.75;
    }

    .buttons {
      position: relative;
      height: 170px;
      display: grid;
      place-items: center;
      margin-top: 4px;
      touch-action: manipulation;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      background: #ff2d6f;
      color: white;
      transform: scale(var(--yesScale));
      box-shadow: 0 10px 22px rgba(255, 45, 111, 0.25);
      position: absolute;
      left: 50%;
      top: 45%;
      translate: -50% -50%;
      z-index: 2;
    }

    #noBtn {
      background: #f1f1f1;
      color: #222;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position: absolute;
      left: 50%;
      top: 82%;
      translate: -50% -50%;
      z-index: 1;
    }

    #noBtn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .msg {
      margin-top: 12px;
      min-height: 28px;
      font-weight: 700;
      color: #ff2d6f;
    }

    .counter {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.65;
      min-height: 18px;
    }

    .sparkle {
      position: absolute;
      inset: -40px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,45,111,0.12), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,120,170,0.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,45,111,0.10), transparent 45%);
      pointer-events: none;
      filter: blur(0.2px);
    }

    .yesScene {
      display: none;
      margin-top: 10px;
      padding-top: 8px;
    }

    .kissGif {
      width: min(320px, 86vw);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.14);
      display: block;
      margin: 10px auto 0;
    }

    .yesHeadline {
      font-size: 22px;
      margin: 6px 0 2px;
      color: #ff2d6f;
      font-weight: 800;
    }

    .sub {
      margin: 0;
      opacity: 0.75;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sparkle"></div>

    <!-- Minion giving heart (GIF) -->
    <img
      class="topGif"
      alt="Minion giving a heart"
      src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3A1ZWc1cnNzczZrMTRmYTl1em9sZGg1a3d3dmZ1cGI2eGlldjF2ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/EIpHa3LdR8Zr9Z11NZ/giphy.gif"
    />

    <h1>Be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="buttons" id="arena">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="counter" id="counter"></div>

    <!-- Shows after YES -->
    <div class="yesScene" id="yesScene">
      <div class="yesHeadline">YAYYYY 💖</div>
      <p class="sub">Okay Valentine… it’s official 😘</p>

      <!-- Cartoon cats kissing (GIF) -->
      <img
        class="kissGif"
        alt="Cartoon cats kissing"
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExamtpNTR1dzRmZnBnOWl5dmR2b3A1bjZudDRqNHlldmxwMWFxb2kwciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KmxmoHUGPDjfQXqGgv/200w.gif"
      />
    </div>
  </div>

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function setScale(scale) {
      document.documentElement.style.setProperty("--yesScale", scale.toFixed(2));
    }
