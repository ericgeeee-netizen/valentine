<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe1ec, #fff);
      color: #1a1a1a;
    }

    .card {
      width: min(560px, 94vw);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 18px 18px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      inset: -40px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,45,111,0.12), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,120,170,0.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,45,111,0.10), transparent 45%);
      pointer-events: none;
    }

    .topGif {
      width: 155px;
      height: 155px;
      object-fit: contain;
      display: block;
      margin: 4px auto 6px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.10));
    }

    h1 {
      margin: 6px 0 6px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 14px;
      opacity: 0.75;
      font-weight: 600;
    }

    .buttonRow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;            /* prevents overlap on small screens */
      margin-top: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      font-weight: 900;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;        /* keeps phrases on one line */
      max-width: 100%;
    }

    /* NO stays readable */
    #noBtn {
      background: #f1f1f1;
      color: #222;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      font-size: 16px;
      padding: 12px 16px;
      min-width: 140px;
    }

    /* YES grows by size/padding (no overlap) */
    #yesBtn {
      background: #ff2d6f;
      color: white;
      box-shadow: 0 10px 22px rgba(255, 45, 111, 0.25);
      font-size: 18px;
      padding: 14px 20px;
      min-width: 140px;
      transition: font-size 180ms ease, padding 180ms ease, transform 180ms ease;
    }

    /* Optional little pop effect */
    .pop {
      transform: translateY(-1px);
    }

    .msg {
      margin-top: 14px;
      min-height: 26px;
      font-weight: 900;
      color: #ff2d6f;
    }

    .yesScene {
      display: none;
      margin-top: 12px;
      padding-top: 6px;
    }

    .yesHeadline {
      font-size: 22px;
      margin: 6px 0 2px;
      color: #ff2d6f;
      font-weight: 1000;
    }

    .sub {
      margin: 0;
      opacity: 0.75;
      font-weight: 700;
    }

    .kissGif {
      width: min(320px, 86vw);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.14);
      display: block;
      margin: 10px auto 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sparkle"></div>

    <!-- Minion giving heart -->
    <img
      class="topGif"
      alt="Minion giving a heart"
      src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3A1ZWc1cnNzczZrMTRmYTl1em9sZGg1a3d3dmZ1cGI2eGlldjF2ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/EIpHa3LdR8Zr9Z11NZ/giphy.gif"
    />

    <h1>Be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="buttonRow">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- Shows after YES -->
    <div class="yesScene" id="yesScene">
      <div class="yesHeadline">YAYYYY 💖</div>
      <p class="sub">Okay Valentine… it’s official 😘</p>

      <!-- Cats kissing -->
      <img
        class="kissGif"
        alt="Cartoon cats kissing"
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExamtpNTR1dzRmZnBnOWl5dmR2b3A1bjZudDRqNHlldmxwMWFxb2kwciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KmxmoHUGPDjfQXqGgv/200w.gif"
      />
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const yesBtn = document.getElementById("yesBtn");
      const noBtn  = document.getElementById("noBtn");
      const msg    = document.getElementById("msg");
      const yesScene = document.getElementById("yesScene");

      const MAX_NO_CLICKS = 10;

      // Exact phrases you requested (also becomes the NO button text)
      const noPhrases = [
        "are you sure",
        "are you sure youre sure",
        "baby pleaseeeee",
        "just say yes babe",
        "you better say yes",
        "last chance",
        "last chnace",
        "last chance",
        "last chaace",
        "last chance"
      ];

      // More dramatic YES growth (index = number of No clicks)
      const yesSizes = [
        { fs: 18, py: 14, px: 20 }, // 0
        { fs: 22, py: 16, px: 26 }, // 1
        { fs: 26, py: 18, px: 34 }, // 2
        { fs: 30, py: 20, px: 42 }, // 3
        { fs: 34, py: 22, px: 52 }, // 4
        { fs: 38, py: 24, px: 62 }, // 5
        { fs: 42, py: 26, px: 72 }, // 6
        { fs: 46, py: 28, px: 82 }, // 7
        { fs: 50, py: 30, px: 92 }, // 8
        { fs: 54, py: 32, px: 102 }, // 9
        { fs: 58, py: 34, px: 112 }  // 10
      ];

      let noClicks = 0;

      function applyYesSize() {
        const s = yesSizes[Math.min(noClicks, yesSizes.length - 1)];
        yesBtn.style.fontSize = s.fs + "px";
        yesBtn.style.padding = `${s.py}px ${s.px}px`;

        // tiny pop
        yesBtn.classList.add("pop");
        setTimeout(() => yesBtn.classList.remove("pop"), 160);
      }

      // initial
      msg.textContent = "";
      applyYesSize();

      noBtn.addEventListener("click", () => {
        if (noClicks >= MAX_NO_CLICKS) return;

        noClicks++;

        const phrase = noPhrases[noClicks - 1] || "last chance";
        noBtn.textContent = phrase;
        msg.textContent = phrase;

        applyYesSize();

        if (noClicks >= MAX_NO_CLICKS) {
          // After 10th click: remove NO button, leaving only YES
          noBtn.remove();
        }
      });

      yesBtn.addEventListener("click", () => {
        msg.textContent = "YAYYYY 💖 It’s a date, Valentine 😘";
        yesScene.style.display = "block";
        yesBtn.disabled = true;
        yesBtn.style.opacity = "0.96";
      });
    });
  </script>
</body>
</html>
