<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    :root { --yesScale: 1; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe1ec, #fff);
      color: #1a1a1a;
    }

    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 18px 18px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      inset: -40px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,45,111,0.12), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,120,170,0.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,45,111,0.10), transparent 45%);
      pointer-events: none;
    }

    .topGif {
      width: 160px;
      height: 160px;
      object-fit: contain;
      display: block;
      margin: 4px auto 6px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.10));
    }

    h1 {
      margin: 6px 0 6px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 14px;
      opacity: 0.75;
    }

    .buttons {
      position: relative;
      height: 190px;
      display: grid;
      place-items: center;
      margin-top: 4px;
      touch-action: manipulation;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 850;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    #yesBtn {
      background: #ff2d6f;
      color: white;
      box-shadow: 0 10px 22px rgba(255, 45, 111, 0.25);
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%) scale(var(--yesScale));
      z-index: 2;
    }

    #noBtn {
      background: #f1f1f1;
      color: #222;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position: absolute;
      left: 50%;
      top: 82%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .msg {
      margin-top: 12px;
      min-height: 26px;
      font-weight: 800;
      color: #ff2d6f;
    }

    .yesScene {
      display: none;
      margin-top: 10px;
      padding-top: 8px;
    }

    .kissGif {
      width: min(320px, 86vw);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.14);
      display: block;
      margin: 10px auto 0;
    }

    .yesHeadline {
      font-size: 22px;
      margin: 6px 0 2px;
      color: #ff2d6f;
      font-weight: 900;
    }

    .sub {
      margin: 0;
      opacity: 0.75;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sparkle"></div>

    <!-- Minion giving heart -->
    <img
      class="topGif"
      alt="Minion giving a heart"
      src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3A1ZWc1cnNzczZrMTRmYTl1em9sZGg1a3d3dmZ1cGI2eGlldjF2ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/EIpHa3LdR8Zr9Z11NZ/giphy.gif"
    />

    <h1>Be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="buttons" id="arena">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- Shows after YES -->
    <div class="yesScene" id="yesScene">
      <div class="yesHeadline">YAYYYY 💖</div>
      <p class="sub">Okay Valentine… it’s official 😘</p>

      <!-- Cats kissing -->
      <img
        class="kissGif"
        alt="Cartoon cats kissing"
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExamtpNTR1dzRmZnBnOWl5dmR2b3A1bjZudDRqNHlldmxwMWFxb2kwciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KmxmoHUGPDjfQXqGgv/200w.gif"
      />
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const yesBtn = document.getElementById("yesBtn");
      const noBtn  = document.getElementById("noBtn");
      const msg    = document.getElementById("msg");
      const arena  = document.getElementById("arena");
      const yesScene = document.getElementById("yesScene");

      const MAX_NO_CLICKS = 10;

      // EXACT messages you requested (also used as the No button label)
      const noPhrases = [
        "are you sure",
        "are you sure youre sure",
        "baby pleaseeeee",
        "just say yes babe",
        "you better say yes",
        "last chance",
        "last chnace",
        "last chance",
        "last chaace",
        "last chance"
      ];

      let noClicks = 0;

      function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

      function setYesScale(scale) {
        document.documentElement.style.setProperty("--yesScale", String(scale.toFixed(2)));
      }

      function moveNoButton() {
        const w = arena.clientWidth;
        const h = arena.clientHeight;

        const btnW = noBtn.offsetWidth;
        const btnH = noBtn.offsetHeight;

        const padding = 10;
        const maxX = Math.max(padding, w - btnW - padding);
        const maxY = Math.max(padding, h - btnH - padding);

        const x = clamp(Math.random() * maxX, padding, maxX);
        const y = clamp(Math.random() * maxY, padding, maxY);

        noBtn.style.left = `${x}px`;
        noBtn.style.top  = `${y}px`;
        noBtn.style.transform = "translate(0, 0)";
      }

      function growYes() {
        // Progressive growth each No click
        const scale = Math.min(1 + noClicks * 0.25, 3.6);
        setYesScale(scale);
      }

      // Initial message
      msg.textContent = "";

      // Place NO randomly after layout measures are ready
      requestAnimationFrame(() => moveNoButton());

      // Desktop: run away on hover (mouse only)
      noBtn.addEventListener("pointerenter", (e) => {
        if (e.pointerType === "mouse" && noClicks < MAX_NO_CLICKS) moveNoButton();
      });

      // Phone: run away on press/hold (quick taps still click)
      let holdTimer = null;
      noBtn.addEventListener("touchstart", () => {
        if (noClicks >= MAX_NO_CLICKS) return;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          if (noClicks < MAX_NO_CLICKS) moveNoButton();
        }, 140);
      }, { passive: true });

      noBtn.addEventListener("touchend", () => clearTimeout(holdTimer), { passive: true });

      // NO click logic
      noBtn.addEventListener("click", () => {
        if (noClicks >= MAX_NO_CLICKS) return;

        noClicks++;

        // Update the No button label + message area with requested phrase
        const phrase = noPhrases[noClicks - 1] || "last chance";
        noBtn.textContent = phrase;
        msg.textContent = phrase;

        // Grow YES
        growYes();

        // After 10th click: remove NO button entirely
        if (noClicks >= MAX_NO_CLICKS) {
          noBtn.remove();
          return;
        }

        // Otherwise, keep moving NO around
        moveNoButton();
      });

      // YES click logic
      yesBtn.addEventListener("click", () => {
        msg.textContent = "YAYYYY 💖 It’s a date, Valentine 😘";
        yesScene.style.display = "block";

        // Lock YES so it feels final
        yesBtn.disabled = true;
        yesBtn.style.opacity = 0.95;

        setYesScale(3.2);
      });
    });
  </script>
</body>
</html>
