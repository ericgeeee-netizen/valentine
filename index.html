<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    :root { --yesScale: 1; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe1ec, #fff);
      color: #1a1a1a;
    }

    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 18px;
      opacity: 0.75;
    }

    .buttons {
      position: relative;
      height: 140px;
      display: grid;
      place-items: center;
      gap: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 650;
      transition: transform 140ms ease, box-shadow 140ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      background: #ff2d6f;
      color: white;
      transform: scale(var(--yesScale));
      box-shadow: 0 10px 22px rgba(255, 45, 111, 0.25);
      position: absolute;
      left: 50%;
      top: 44%;
      translate: -50% -50%;
      z-index: 2;
    }

    #yesBtn:hover { box-shadow: 0 12px 28px rgba(255, 45, 111, 0.33); }

    #noBtn {
      background: #f1f1f1;
      color: #222;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position: absolute;
      left: 50%;
      top: 78%;
      translate: -50% -50%;
      z-index: 1;
    }

    #noBtn:hover { transform: translateZ(0) scale(1.02); }

    .msg {
      margin-top: 12px;
      min-height: 24px;
      font-weight: 600;
      color: #ff2d6f;
    }

    .sparkle {
      position: absolute;
      inset: -40px;
      background: radial-gradient(circle at 20% 30%, rgba(255,45,111,0.12), transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(255,120,170,0.16), transparent 45%),
                  radial-gradient(circle at 50% 90%, rgba(255,45,111,0.10), transparent 45%);
      pointer-events: none;
      filter: blur(0.2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sparkle"></div>
    <h1>Be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="buttons" id="arena">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const msg    = document.getElementById("msg");
    const arena  = document.getElementById("arena");

    let noClicks = 0;
    let yesScale = 1;

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNoButton() {
      const rect = arena.getBoundingClientRect();

      // Keep button inside arena with padding
      const padding = 10;
      const btnRect = noBtn.getBoundingClientRect();
      const maxX = rect.width  - btnRect.width  - padding;
      const maxY = rect.height - btnRect.height - padding;

      const x = clamp(Math.random() * maxX, padding, maxX);
      const y = clamp(Math.random() * maxY, padding, maxY);

      // Position relative to arena
      noBtn.style.left = `${x}px`;
      noBtn.style.top  = `${y}px`;
      noBtn.style.translate = "0 0";
    }

    function growYesButton() {
      // Increase scale each "No" click, capped so it doesn't get absurd
      yesScale = Math.min(yesScale + 0.18, 3.2);
      document.documentElement.style.setProperty("--yesScale", yesScale.toFixed(2));
    }

    noBtn.addEventListener("click", () => {
      noClicks++;
      growYesButton();
      moveNoButton();

      const lines = [
        "Wait… what 😭",
        "Try again 😌",
        "That button seems unsure…",
        "No is not an option 😂",
        "Just click yes already 💘"
      ];
      msg.textContent = lines[Math.min(noClicks - 1, lines.length - 1)];
    });

    yesBtn.addEventListener("click", () => {
      msg.textContent = "YAYYY 💖 See you Valentine 😘";
      // Lock it in
      noBtn.disabled = true;
      yesBtn.disabled = true;
      noBtn.style.opacity = 0.55;
      yesBtn.style.opacity = 0.95;
    });

    // Start with "No" in a slightly different spot on load
    moveNoButton();
  </script>
</body>
</html>
