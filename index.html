<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    :root { --yesScale: 1; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe1ec, #fff);
      color: #1a1a1a;
    }

    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 18px 18px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      inset: -40px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,45,111,0.12), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,120,170,0.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,45,111,0.10), transparent 45%);
      pointer-events: none;
    }

    .topGif {
      width: 160px;
      height: 160px;
      object-fit: contain;
      display: block;
      margin: 4px auto 6px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.10));
    }

    h1 {
      margin: 6px 0 6px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 14px;
      opacity: 0.75;
    }

    .buttons {
      position: relative;
      height: 170px;
      display: grid;
      place-items: center;
      margin-top: 4px;
      touch-action: manipulation;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* YES: translate + scale using CSS var (very compatible) */
    #yesBtn {
      background: #ff2d6f;
      color: white;
      box-shadow: 0 10px 22px rgba(255, 45, 111, 0.25);
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%) scale(var(--yesScale));
      z-index: 2;
    }

    #noBtn {
      background: #f1f1f1;
      color: #222;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position: absolute;
      left: 50%;
      top: 82%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    #noBtn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .msg {
      margin-top: 12px;
      min-height: 28px;
      font-weight: 800;
      color: #ff2d6f;
    }
